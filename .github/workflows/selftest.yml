name: action-selftest
on:
  workflow_dispatch:
  pull_request:
    paths: ["action/**", "aiescrow/**", ".github/workflows/selftest.yml"]
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dummy artefact and throwaway TEST-ONLY keys (generated here, protect nothing)
        id: k
        run: |
          python -m pip install --quiet .
          mkdir -p dummy "$RUNNER_TEMP/k" && echo '{"memory":"selftest"}' > dummy/state.json
          for n in vendor holder; do python -m aiescrow keygen $n --kind ed25519 --out-dir "$RUNNER_TEMP/k"; done
          python -m aiescrow keygen user --kind x25519 --out-dir "$RUNNER_TEMP/k"
          echo "depositor=$(cat "$RUNNER_TEMP/k/vendor.key")" >> "$GITHUB_OUTPUT"
          echo "beneficiary=$(cat "$RUNNER_TEMP/k/user.pub")" >> "$GITHUB_OUTPUT"
          echo "holder=$(cat "$RUNNER_TEMP/k/holder.pub")" >> "$GITHUB_OUTPUT"
          echo "keyid=$(python -m aiescrow keyid "$RUNNER_TEMP/k/vendor.pub")" >> "$GITHUB_OUTPUT"
      - uses: ./action
        with:
          artefacts: "dummy/*.json"
          beneficiary_pub: ${{ steps.k.outputs.beneficiary }}
          depositor_key: ${{ steps.k.outputs.depositor }}
          holder_pub: ${{ steps.k.outputs.holder }}
          expect_keyid: ${{ steps.k.outputs.keyid }}
          push: "false"
