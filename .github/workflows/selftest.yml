name: action-selftest
on:
  workflow_dispatch:
  pull_request:
    paths: ["action/**", "aiescrow/**", ".github/workflows/selftest.yml"]
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dummy artefact and TEST-ONLY keys (action/testdata, protect nothing)
        id: k
        run: |
          mkdir -p dummy && echo '{"memory":"selftest"}' > dummy/state.json
          echo "depositor=$(cat action/testdata/TEST-ONLY-vendor.priv)" >> "$GITHUB_OUTPUT"
          echo "beneficiary=$(cat action/testdata/TEST-ONLY-user.pub)" >> "$GITHUB_OUTPUT"
          echo "holder=$(cat action/testdata/TEST-ONLY-holder.pub)" >> "$GITHUB_OUTPUT"
          echo "keyid=$(cat action/testdata/TEST-ONLY-vendor.keyid)" >> "$GITHUB_OUTPUT"
      - uses: ./action
        with:
          artefacts: "dummy/*.json"
          beneficiary_pub: ${{ steps.k.outputs.beneficiary }}
          depositor_key: ${{ steps.k.outputs.depositor }}
          holder_pub: ${{ steps.k.outputs.holder }}
          expect_keyid: ${{ steps.k.outputs.keyid }}
          push: "false"
